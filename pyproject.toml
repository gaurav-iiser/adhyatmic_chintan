[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adhyatmik-tools"
version = "0.4.0"
description = "Lecture ingestion, Hindi/Sanskrit-aware transcription, conservative cleaning, and human review tools for the Adhyatmik project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "openai>=1.60,<3",
  "pydantic-settings>=2.6,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
adhyatmik = "adhyatmik.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
